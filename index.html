<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucko - 多平台机器人框架</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            padding: 40px 24px;
            text-align: center;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }

        .logo-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e6edf3;
            margin-bottom: 16px;
        }

        .logo-title a {
            color: inherit;
            text-decoration: none;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #8b949e;
            margin-bottom: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: #238636;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .btn-secondary {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            background: #30363d;
        }

        .hero-image {
            text-align: center;
            padding: 40px 24px;
        }

        .hero-image img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .features {
            padding: 80px 24px;
            background: #161b22;
        }

        .features h2 {
            text-align: center;
            font-size: 1.75rem;
            margin-bottom: 48px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .feature-card {
            text-align: center;
            padding: 24px;
        }

        .feature-emoji {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        .feature-card h3 {
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: #e6edf3;
        }

        .feature-card p {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .contact {
            padding: 80px 24px;
        }

        .contact-inner {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .contact h2 {
            font-size: 1.75rem;
            margin-bottom: 32px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .contact-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }

        .contact-card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        .contact-card h4 {
            color: #e6edf3;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .contact-card p {
            color: #8b949e;
            font-size: 0.9rem;
        }

        footer {
            padding: 40px 24px;
            border-top: 1px solid #30363d;
            text-align: center;
            color: #8b949e;
            font-size: 0.9rem;
        }

        footer a {
            color: #58a6ff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .logo-title {
                font-size: 2rem;
            }

            header h1 {
                font-size: 1.2rem;
            }

            .features-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <img src="logo.svg" alt="Cucko" class="logo-img" onerror="this.style.display='none'">
            <h1 class="logo-title"><a href="index.html">Cucko</a></h1>
            <h1>支持多平台的机器人框架</h1>
            <div class="header-buttons">
                <a href="docs.html" class="btn btn-primary">查看文档</a>
                <a href="https://github.com/change-nx/Cucko" class="btn btn-secondary" target="_blank">GitHub</a>
            </div>
        </div>
    </header>

    <section class="hero-image">
        <div class="container">
            <img src="https://aka.doubaocdn.com/s/i98Q1wQ57d" alt="展示" onerror="this.parentElement.style.display='none'">
        </div>
    </section>

    <section class="features">
        <div class="container">
            <h2>核心特性</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-emoji">📱</div>
                    <h3>多平台支持</h3>
                    <p>支持 QQ 官机和 OneBot v11，灵活对接各种聊天平台</p>
                </div>
                <div class="feature-card">
                    <div class="feature-emoji">🧩</div>
                    <h3>插件开发</h3>
                    <p>简单易用的插件系统，快速开发功能强大的机器人</p>
                </div>
                <div class="feature-card">
                    <div class="feature-emoji">⚡</div>
                    <h3>高效稳定</h3>
                    <p>轻量高效的设计，稳定运行于各种环境</p>
                </div>
            </div>
        </div>
    </section>

    <section class="contact">
        <div class="container">
            <div class="contact-inner">
                <h2>联系我们</h2>
                <div class="contact-grid">
                    <a href="mailto:couest@qq.com" class="contact-card">
                        <h4>邮箱</h4>
                        <p>couest@qq.com</p>
                    </a>
                    <a href="https://qm.qq.com/q/vnhh3Xesb6" class="contact-card" target="_blank">
                        <h4>QQ 群</h4>
                        <p>点击加入群聊</p>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2024 <a href="https://github.com/change-nx/Cucko" target="_blank">Cucko</a> · MIT License</p>
        </div>
    </footer>
</body>
</html>
